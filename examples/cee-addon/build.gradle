plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.89'
}
group = 'org.cha0scollective.wwpg.examples'
version = '1.0.0'
base { archivesName = 'wwpg-upstream-api-example' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
repositories {
    maven { url = providers.gradleProperty('apiRepository').getOrElse('../../build/maven-repository') }
    mavenCentral()
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://mvn.devos.one/snapshots' }
    maven { url = 'https://maven.architectury.dev' }
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://cursemaven.com' } }
        filter { includeGroup 'curse.maven' }
    }
}
neoForge {
    version = '21.1.231'
    mods { wwpg_api_upstream { sourceSet sourceSets.main } }
}
dependencies {
    compileOnly 'org.cha0scollective.wwpg:wwpg-api:1.0.0'
    compileOnly 'org.cha0scollective.wwpg:wwpg-cee-api:1.0.0'
    compileOnly('maven.modrinth:qYJdIoAx:KWxEmmON') { transitive = false }
    compileOnly('curse.maven:power-grid-1321420:8880715') { transitive = false }
    compileOnly('com.simibubi.create:create-1.21.1:6.0.10-280') { transitive = false }
    compileOnly 'net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1'
    compileOnly 'com.tterrag.registrate:Registrate:MC1.21-1.3.0+67'
    compileOnly 'dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:1.0.6'
    compileOnly 'dev.architectury:architectury-neoforge:13.0.8'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Jar).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    includeEmptyDirs = false
}
tasks.named('jar') {
    from('LICENSE') { into 'META-INF'; rename { 'WWPG-EXAMPLE-LICENSE.txt' } }
}
