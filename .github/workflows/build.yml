name: Focused Linux motor diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  motor:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew assemble --no-daemon
      - name: Four cold phases with read-only motor state diagnostics
        run: python tools/diagnostics/motor_cold_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motor-diagnostic-linux
          path: |
            local/motor-cold-probe/
            build/libs/wwpg-0.2.8-rc.1-gametests.jar
            build/libs/wwpg-0.2.8-rc.1.jar
