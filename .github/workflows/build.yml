name: Build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        backend: [NATIVE, JAVA]
        profile: [BASE, PINOUT]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - if: runner.os != 'Windows'
        run: chmod +x gradlew
      - run: ./gradlew build -PtestProfile=${{ matrix.profile }} --no-daemon
      - run: ./gradlew runPackagedGameTestServer -PtestProfile=${{ matrix.profile }} -PtestBackend=${{ matrix.backend }} -PrestartPhase=SETUP --no-daemon
      - name: Three consecutive cold world restarts
        run: |
          for pass in 1 2 3; do
            ./gradlew runPackagedGameTestServer -PtestProfile=${{ matrix.profile }} -PtestBackend=${{ matrix.backend }} -PrestartPhase=VERIFY --no-daemon
            cp run/logs/latest.log "run/restart-${pass}.log"
          done
      - run: ./gradlew runUpstreamReferenceServer -PtestBackend=${{ matrix.backend }} --no-daemon
      - run: ./gradlew runReferenceCompatibilityServer -PtestBackend=${{ matrix.backend }} --no-daemon
      - run: ./gradlew runPackagedGameTestServer -PtestBackend=${{ matrix.backend }} -PtestNamespaces=wwpg_example -PtestDirectory=run/example --no-daemon
      - run: ./gradlew runPackagedGameTestServer -PtestBackend=${{ matrix.backend }} -PtestNamespaces=wwpg_example -PtestDirectory=run/example -PrestartPhase=VERIFY --no-daemon
      - run: ./gradlew runPackagedGameTestServer -PtestBackend=${{ matrix.backend }} -PtestNamespaces=wwpg_showroom -PtestDirectory=run/showroom --no-daemon
      - run: ./gradlew runPackagedGameTestServer -PtestBackend=${{ matrix.backend }} -PtestNamespaces=wwpg_showroom -PtestDirectory=run/showroom -PrestartPhase=VERIFY --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wwpg-${{ matrix.os }}-${{ matrix.backend }}-${{ matrix.profile }}
          path: |
            build/libs/*.jar
            build/reports/tests/
            run/logs/
            run/crash-reports/
            run/stationary-registry.json
            run/restart-*.log
            run/designer-before-restart.nbt
            run/designer-cycles-before-restart.nbt
            run/packaged-*.json
            run/showroom/logs/
            run/showroom/crash-reports/
            run/showroom/showroom-coverage.json
