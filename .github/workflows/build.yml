name: Build
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to test (reuse preserved Windows acceptance when selecting Linux)'
        type: choice
        options: [all, linux]
        default: all
      reuse_windows_yard:
        description: 'Retain separately verified Windows Pinout yard evidence; run only the Linux combined yard here'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ matrix.os }}
    # The complete functional matrix includes 18 additional JVM launches after
    # the reference comparison. Preserve each launch's 600-second watchdog.
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms == 'linux' && '["ubuntu-24.04"]' || '["ubuntu-24.04", "windows-latest"]') }}
        backend: [NATIVE, JAVA]
        profile: [BASE, PINOUT]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record the exact checked-out source and CI attempt
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert source == os.environ['EXPECTED_SOURCE_SHA'], 'Checkout differs from requested frozen source'
          evidence = dict(schema=1, source_sha=source,
              source_tree=subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              run_id=int(os.environ['GITHUB_RUN_ID']), run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),
              event=os.environ['GITHUB_EVENT_NAME'])
          evidence['stationary_yard_policy'] = 'combined-pinout-v1'
          path = pathlib.Path('build/ci-source.json'); path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(evidence, indent=2) + '\n', encoding='utf-8', newline='\n')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify stationary world export and preservation tools
        run: python tools/test_stationary_export.py
      - name: Verify final packaging acceptance gates
        run: python tools/test_beta5_package.py
      - name: Verify public API binary contracts and publication gates
        run: python tools/test_api_compatibility.py
      - name: Verify five-download layout, short notes and safe release publication
        run: python tools/test_release_process.py
      - name: Verify API Workshop export evidence and native save preservation
        run: python tools/test_api_workshop_export.py
      - name: Verify CI provenance, cold sequences and actual lifecycle evidence gates
        run: python tools/test_api_ci_evidence.py
      - name: Verify exact SDK extraction and independent build gates
        run: python tools/test_extracted_api_sdk.py
      - name: Verify bounded child launches and Windows batch quoting
        run: python tools/test_checked_runner.py
      - name: Verify immutable graphical and multiplayer acceptance helper provenance
        run: python tools/test_api_client_provenance.py
      - if: runner.os != 'Windows'
        run: chmod +x gradlew
      - name: Build runtime and publish both SDK APIs to an isolated local Maven repository
        run: python tools/run_checked.py --timeout 1200 -- ./gradlew build publishAllPublicationsToSdkRepository -PtestProfile=${{ matrix.profile }} --no-daemon
      - name: Snapshot the first published API contracts and archive the explicit Maven versions
        run: |
          python tools/verify_api_compatibility.py build/libs/wwpg-api-1.0.0.jar --api-version 1.0.0 --output build/api-contract.json
          python tools/verify_api_compatibility.py build/libs/wwpg-cee-api-1.0.0.jar --prefix org.cha0scollective.wwpg.api.cee --api-version 1.0.0 --output build/cee-api-contract.json
          python tools/package_api_release.py --maven-source build/maven-repository --output build/distributions/wwpg-api-1.0.0-maven.zip
      - name: Build the general example independently against published Maven API artifacts
        run: python tools/run_checked.py --timeout 1200 -- ./gradlew -p examples/extension-addon build --no-daemon
      - name: Build the CEE panel and PG board example independently against published APIs
        run: python tools/run_checked.py --timeout 1200 -- ./gradlew -p examples/cee-addon build --no-daemon
      - name: Export independently buildable example projects with their own wrappers and licenses
        run: |
          python tools/package_api_release.py --example-source examples/extension-addon --output build/distributions/wwpg-api-example-1.0.0-source.zip
          python tools/package_api_release.py --example-source examples/cee-addon --output build/distributions/wwpg-upstream-api-example-1.0.0-source.zip
      - name: Build the downloadable adjustable-load starter from extracted SDK artifacts
        if: matrix.profile == 'BASE'
        run: python tools/authoring_starter_acceptance.py prepare --output build/authoring-starter --runtime build/libs/wwpg-0.2.2-beta.4.jar
      - name: Verify starter controls, native tools, cold persistence and real chunk reload
        if: matrix.profile == 'BASE'
        run: python tools/authoring_starter_acceptance.py server --output build/authoring-starter --runtime build/libs/wwpg-0.2.2-beta.4.jar --backend ${{ matrix.backend }}
      - name: Verify global freeze and one-tick stepping in an isolated API fixture
        run: python tools/run_checked.py -- ./gradlew runPackagedGameTestServer -PtestProfile=${{ matrix.profile }} -PtestBackend=${{ matrix.backend }} -PtestApiAddon=true -PtestNamespaces=wwpg_api_pause -PtestDirectory=run/api-pause --no-daemon
      - name: Verify stopped-before-ready persisted wire retirement
        run: |
          python tools/run_checked.py -- ./gradlew runPackagedGameTestServer -PtestProfile=${{ matrix.profile }} -PtestBackend=${{ matrix.backend }} -PtestApiAddon=true -PtestNamespaces=wwpg_api_pending_restart -PtestDirectory=run/api-pending-restart -PrestartPhase=SETUP --no-daemon
          cp run/api-pending-restart/logs/latest.log run/api-pending-restart/setup-phase.log
          python tools/run_checked.py -- ./gradlew runPackagedGameTestServer -PtestProfile=${{ matrix.profile }} -PtestBackend=${{ matrix.backend }} -PtestApiAddon=true -PtestNamespaces=wwpg_api_pending_restart -PtestDirectory=run/api-pending-restart -PrestartPhase=ARM --no-daemon
          cp run/api-pending-restart/logs/latest.log run/api-pending-restart/arm-phase.log
          python tools/run_checked.py -- ./gradlew runPackagedGameTestServer -PtestProfile=${{ matrix.profile }} -PtestBackend=${{ matrix.backend }} -PtestApiAddon=true -PtestNamespaces=wwpg_api_pending_restart -PtestDirectory=run/api-pending-restart -PrestartPhase=VERIFY --no-daemon
          cp run/api-pending-restart/logs/latest.log run/api-pending-restart/verify-phase.log
      - name: Run both packaged public API example fixture suites
        run: python tools/run_checked.py -- ./gradlew runPackagedGameTestServer -PtestProfile=${{ matrix.profile }} -PtestBackend=${{ matrix.backend }} -PtestApiAddon=true -PtestNamespaces=wwpg_api,wwpg_api_faults,wwpg_api_restart,wwpg_api_upstream,wwpg_api_upstream_restart -PtestDirectory=run/api --no-daemon
      - name: Three cold restarts of the packaged API example assemblies
        run: |
          for pass in 1 2 3; do
            python tools/run_checked.py -- ./gradlew runPackagedGameTestServer -PtestProfile=${{ matrix.profile }} -PtestBackend=${{ matrix.backend }} -PtestApiAddon=true -PtestNamespaces=wwpg_api,wwpg_api_faults,wwpg_api_restart,wwpg_api_upstream,wwpg_api_upstream_restart -PtestDirectory=run/api -PrestartPhase=VERIFY --no-daemon
            cp run/api/logs/latest.log "run/api/restart-${pass}.log"
          done
      - run: python tools/run_checked.py -- ./gradlew runPackagedGameTestServer -PtestProfile=${{ matrix.profile }} -PtestBackend=${{ matrix.backend }} -PrestartPhase=SETUP --no-daemon
      - name: Verify restoration pauses, storage, independent factories and graph couplings
        run: python tools/run_checked.py -- ./gradlew runPackagedGameTestServer -PtestProfile=${{ matrix.profile }} -PtestBackend=${{ matrix.backend }} -PtestNamespaces=wwpg_loading -PtestDirectory=run/loading --no-daemon
      - name: Verify native board assembly has its own powered backend audit
        run: python tools/run_checked.py -- ./gradlew runPackagedGameTestServer -PtestProfile=${{ matrix.profile }} -PtestBackend=${{ matrix.backend }} -PtestNamespaces=wwpg_board_startup -PtestDirectory=run/board-startup --no-daemon
      - name: Verify matrix ownership, unload regrouping, guarded rejection and handheld connectors
        run: |
          namespaces=wwpg_unload,wwpg_solver_safety,wwpg_matrix_ownership,wwpg_meter_sampling
          if [ '${{ matrix.backend }}' = NATIVE ]; then namespaces="$namespaces,wwpg_native_guard"; fi
          python tools/run_checked.py -- ./gradlew runPackagedGameTestServer -PtestProfile=${{ matrix.profile }} -PtestBackend=${{ matrix.backend }} -PtestApiAddon=true -PtestNamespaces="$namespaces" -PtestDirectory=run/safety --no-daemon
      - name: Three consecutive cold world restarts
        run: |
          for pass in 1 2 3; do
            python tools/run_checked.py -- ./gradlew runPackagedGameTestServer -PtestProfile=${{ matrix.profile }} -PtestBackend=${{ matrix.backend }} -PrestartPhase=VERIFY --no-daemon
            cp run/logs/latest.log "run/restart-${pass}.log"
          done
      - run: python tools/run_checked.py -- ./gradlew runUpstreamReferenceServer -PtestBackend=${{ matrix.backend }} --no-daemon
      - run: python tools/run_checked.py -- ./gradlew runReferenceCompatibilityServer -PtestBackend=${{ matrix.backend }} --no-daemon
      - run: python tools/run_checked.py -- ./gradlew runPackagedGameTestServer -PtestBackend=${{ matrix.backend }} -PtestNamespaces=wwpg_example -PtestDirectory=run/example --no-daemon
      - run: python tools/run_checked.py -- ./gradlew runPackagedGameTestServer -PtestBackend=${{ matrix.backend }} -PtestNamespaces=wwpg_example -PtestDirectory=run/example -PrestartPhase=VERIFY --no-daemon
      - run: python tools/run_checked.py -- ./gradlew runPackagedGameTestServer -PtestBackend=${{ matrix.backend }} -PtestNamespaces=wwpg_showroom -PtestDirectory=run/showroom --no-daemon
      - run: python tools/run_checked.py -- ./gradlew runPackagedGameTestServer -PtestBackend=${{ matrix.backend }} -PtestNamespaces=wwpg_showroom -PtestDirectory=run/showroom -PrestartPhase=VERIFY --no-daemon
      - name: Build stationary yard for the installation profile
        if: matrix.profile == 'PINOUT' && (runner.os != 'Windows' || !inputs.reuse_windows_yard)
        run: python tools/run_checked.py -- ./gradlew runPackagedGameTestServer -PtestProfile=${{ matrix.profile }} -PtestBackend=${{ matrix.backend }} -PtestNamespaces=wwpg_yard -PtestDirectory=run/yard --no-daemon
      - name: Three cold stationary yard restarts
        if: matrix.profile == 'PINOUT' && (runner.os != 'Windows' || !inputs.reuse_windows_yard)
        run: |
          for pass in 1 2 3; do
            python tools/run_checked.py -- ./gradlew runPackagedGameTestServer -PtestProfile=${{ matrix.profile }} -PtestBackend=${{ matrix.backend }} -PtestNamespaces=wwpg_yard -PtestDirectory=run/yard -PrestartPhase=VERIFY --no-daemon
            cp run/yard/logs/latest.log "run/yard/restart-${pass}.log"
          done
      - name: Export and extract the exact stationary yard ZIP
        if: matrix.profile == 'PINOUT' && (runner.os != 'Windows' || !inputs.reuse_windows_yard)
        run: |
          python tools/export_stationary_yard.py --run run/yard --jar build/libs/wwpg-0.2.2-beta.4.jar --target 0.2.2-beta.4 --profile ${{ matrix.profile }} --output build/distributions/wwpg-stationary-${{ matrix.profile }}.zip
          python tools/reopen_stationary_yard.py build/distributions/wwpg-stationary-${{ matrix.profile }}.zip --run run/exported-yard
      - name: Three cold restarts of the extracted ZIP
        if: matrix.profile == 'PINOUT' && (runner.os != 'Windows' || !inputs.reuse_windows_yard)
        run: |
          for pass in 1 2 3; do
            python tools/run_checked.py -- ./gradlew runPackagedGameTestServer -PtestProfile=${{ matrix.profile }} -PtestBackend=${{ matrix.backend }} -PtestNamespaces=wwpg_yard -PtestDirectory=run/exported-yard -PrestartPhase=VERIFY --no-daemon
            cp run/exported-yard/logs/latest.log "run/exported-yard/restart-${pass}.log"
          done
      - name: Build the playable public API Workshop with both independent add-ons
        run: python tools/run_checked.py -- ./gradlew runPackagedGameTestServer -PtestProfile=${{ matrix.profile }} -PtestBackend=${{ matrix.backend }} -PtestApiAddon=true -PtestNamespaces=wwpg_api_world -PtestDirectory=run/api-workshop --no-daemon
      - name: Three cold API Workshop restarts
        run: |
          for pass in 1 2 3; do
            python tools/run_checked.py -- ./gradlew runPackagedGameTestServer -PtestProfile=${{ matrix.profile }} -PtestBackend=${{ matrix.backend }} -PtestApiAddon=true -PtestNamespaces=wwpg_api_world -PtestDirectory=run/api-workshop -PrestartPhase=VERIFY --no-daemon
            cp run/api-workshop/logs/latest.log "run/api-workshop/restart-${pass}.log"
          done
      - name: Export and extract the exact API Workshop ZIP with locked example jars
        run: |
          python tools/export_api_workshop.py --run run/api-workshop --jar build/libs/wwpg-0.2.2-beta.4.jar --example examples/extension-addon/build/libs/wwpg-api-example-1.0.0.jar --upstream-example examples/cee-addon/build/libs/wwpg-upstream-api-example-1.0.0.jar --profile ${{ matrix.profile }} --backend ${{ matrix.backend }} --output build/distributions/wwpg-api-workshop-${{ matrix.profile }}.zip
          python tools/reopen_stationary_yard.py build/distributions/wwpg-api-workshop-${{ matrix.profile }}.zip --run run/exported-api-workshop
      - name: Three cold restarts of the extracted API Workshop ZIP
        run: |
          for pass in 1 2 3; do
            python tools/run_checked.py -- ./gradlew runPackagedGameTestServer -PtestProfile=${{ matrix.profile }} -PtestBackend=${{ matrix.backend }} -PtestApiAddon=true -PtestNamespaces=wwpg_api_world -PtestDirectory=run/exported-api-workshop -PrestartPhase=VERIFY --no-daemon
            cp run/exported-api-workshop/logs/latest.log "run/exported-api-workshop/restart-${pass}.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wwpg-${{ matrix.os }}-${{ matrix.backend }}-${{ matrix.profile }}
          path: |
            build/ci-source.json
            build/libs/*.jar
            build/api-contract.json
            build/cee-api-contract.json
            build/maven-repository/
            build/distributions/wwpg-api-1.0.0-maven.zip
            build/distributions/wwpg-api-example-1.0.0-source.zip
            build/distributions/wwpg-upstream-api-example-1.0.0-source.zip
            examples/extension-addon/build/libs/*.jar
            examples/extension-addon/build/reports/tests/
            examples/cee-addon/build/libs/*.jar
            examples/cee-addon/build/reports/tests/
            build/distributions/wwpg-stationary-*.zip
            build/distributions/wwpg-api-workshop-*.zip
            build/reports/tests/
            build/test-results/test/
            build/watchdog/
            run/logs/
            run/crash-reports/
            run/stationary-registry.json
            run/accuracy-*.json
            run/restart-*.log
            run/designer-before-restart.nbt
            run/designer-cycles-before-restart.nbt
            run/fuse-holders-before-restart.nbt
            run/duplex-before-restart.nbt
            run/pentode-before-restart.nbt
            run/nether-before-restart.nbt
            run/pinout-before-restart.nbt
            run/world/computercraft/computer/**/*.lua
            run/world/computercraft/computer/**/*.json
            run/world/computercraft/computer/**/boots.txt
            run/packaged-*.json
            run/api/logs/
            run/api/crash-reports/
            run/api/packaged-*.json
            run/api/restart-*.log
            run/api/api-*.json
            run/api/*-before-restart.nbt
            run/api-pause/logs/
            run/api-pause/crash-reports/
            run/api-pause/packaged-*.json
            run/api-pending-restart/logs/
            run/api-pending-restart/crash-reports/
            run/api-pending-restart/packaged-*.json
            run/api-pending-restart/*-phase.log
            run/api-pending-restart/*.nbt
            run/api-workshop/logs/
            run/api-workshop/crash-reports/
            run/api-workshop/packaged-*.json
            run/api-workshop/restart-*.log
            run/api-workshop/api-workshop-stations.json
            run/exported-api-workshop/logs/
            run/exported-api-workshop/crash-reports/
            run/exported-api-workshop/extracted-yard.json
            run/exported-api-workshop/packaged-*.json
            run/exported-api-workshop/restart-*.log
            run/exported-api-workshop/api-workshop-stations.json
            run/reference/native-reference-*.json
            run/reference/compatibility-*.json
            run/reference/reference-packaged-*.json
            run/reference/logs/
            run/reference/crash-reports/
            run/example/logs/
            run/example/crash-reports/
            run/example/packaged-*.json
            run/showroom/logs/
            run/showroom/crash-reports/
            run/showroom/packaged-*.json
            run/showroom/showroom-coverage.json
            run/board-startup/logs/
            run/board-startup/crash-reports/
            run/board-startup/packaged-*.json
            run/safety/logs/
            run/safety/crash-reports/
            run/safety/packaged-*.json
            build/authoring-starter/
            run/yard/logs/
            run/yard/crash-reports/
            run/yard/packaged-*.json
            run/yard/restart-*.log
            run/yard/stationary-yard-stations.json
            run/yard/stationary-yard-coverage.json
            run/yard/world/computercraft/computer/**/*.lua
            run/yard/world/computercraft/computer/**/*.json
            run/exported-yard/logs/
            run/exported-yard/crash-reports/
            run/exported-yard/extracted-yard.json
            run/exported-yard/packaged-*.json
            run/exported-yard/restart-*.log
            run/exported-yard/stationary-yard-stations.json
            run/exported-yard/stationary-yard-coverage.json
