name: Focused packaging and SDK checks
on:
  pull_request:
    paths: ['docs/**', 'release/**', 'examples/**', 'tools/**', 'gradle.properties', '.github/workflows/**', 'AGENTS.md']
  push:
    branches: [main]
    paths: ['docs/**', 'release/**', 'examples/**', 'tools/**', 'gradle.properties', '.github/workflows/**', 'AGENTS.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packaging:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/test_release_process.py
      - run: python tools/test_api_compatibility.py
      - run: python tools/test_sdk_documentation.py
      - run: python tools/test_extracted_api_sdk.py
      - run: python tools/test_release_acceptance_reuse.py
      - run: python tools/test_combined_stationary_release.py
