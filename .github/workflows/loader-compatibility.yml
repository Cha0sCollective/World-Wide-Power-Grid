name: Loader compatibility checks
run-name: Loader compatibility (${{ inputs.neo_versions }})
on:
  workflow_dispatch:
    inputs:
      neo_versions:
        description: 'One to four NeoForge 21.1 versions, comma-separated; this does not change verified release versions'
        type: string
        default: '21.1.262'
        required: true
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - id: matrix
        name: Validate version selection and plan independent environments
        env:
          NEO_VERSIONS: ${{ inputs.neo_versions }}
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import loader_compatibility as check
          campaign = dict(policy=check.POLICY, matrix={'include':check.matrix(check.versions(os.environ['NEO_VERSIONS']))})
          Path('build/loader-compatibility').mkdir(parents=True)
          check.suites.write('build/loader-compatibility/plan.json', campaign)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('matrix='+json.dumps(campaign['matrix'], separators=(',',':'))+'\n')
          PY
      - run: chmod +x gradlew
      - run: python tools/test_suites.py audit
      - name: Build and freeze gameplay, fixtures and addon inputs once
        run: python tools/loader_compatibility.py prepare --output build/loader-compatibility/canonical
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loader-compatibility-inputs
          path: build/loader-compatibility/
          if-no-files-found: error
  compatibility:
    name: ${{ matrix.loader }} / ${{ matrix.os }} / ${{ matrix.backend }} / ${{ matrix.installation }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with: {name: loader-compatibility-inputs, path: build/loader-compatibility}
      - if: runner.os != 'Windows'
        run: chmod +x gradlew
      - name: Run ordered compatibility checks against the frozen gameplay jar
        run: >-
          python tools/loader_compatibility.py run
          --inputs build/loader-compatibility/canonical/frozen/loader-inputs.json
          --output build/loader-compatibility/run
          --loader ${{ matrix.loader }} --backend ${{ matrix.backend }} --installation ${{ matrix.installation }}
      - name: Preserve portable results and original failed evidence
        if: always()
        run: >-
          python tools/bundle_suite_evidence.py build/loader-compatibility/run/result.json
          --output build/lc/reports/lc-report-${{ matrix.os }}-${{ matrix.backend }}-${{ matrix.installation }}-${{ matrix.loader }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lc-report-${{ matrix.os }}-${{ matrix.backend }}-${{ matrix.installation }}-${{ matrix.loader }}
          path: build/lc/reports/lc-report-${{ matrix.os }}-${{ matrix.backend }}-${{ matrix.installation }}-${{ matrix.loader }}/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loader-compatibility-diagnostics-${{ matrix.os }}-${{ matrix.backend }}-${{ matrix.installation }}-${{ matrix.loader }}
          path: |
            build/loader-compatibility/run/*.log
            build/loader-compatibility/run/result.json
            build/watchdog/
          if-no-files-found: error
  results:
    needs: [prepare, compatibility]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with: {name: loader-compatibility-inputs, path: build/loader-compatibility}
      - uses: actions/download-artifact@v4
        with:
          pattern: lc-report-*
          path: build/lc/reports
      - name: Require every planned environment and actual process proof
        if: always()
        run: >-
          python tools/loader_compatibility.py collect
          --plan build/loader-compatibility/plan.json
          --inputs build/loader-compatibility/canonical/frozen/loader-inputs.json
          --reports build/lc/reports
          --output build/loader-compatibility/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: loader-compatibility-summary, path: build/loader-compatibility/summary.json, if-no-files-found: error}
