name: NeoForge compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        backend: [NATIVE, JAVA]
        profile: [BASE, PINOUT]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os != 'Windows'
        run: chmod +x gradlew
      - name: Build against the minimum supported loader and freeze the actual jar
        run: |
          python tools/run_checked.py --timeout 1200 -- ./gradlew build publishAllPublicationsToSdkRepository --no-daemon
          python tools/run_checked.py --timeout 1200 -- ./gradlew -p examples/extension-addon build --no-daemon
          python tools/run_checked.py --timeout 1200 -- ./gradlew -p examples/cee-addon build --no-daemon
          mkdir -p build/neoforge-compat
          cp build/libs/wwpg-0.2.2-beta.4.jar build/neoforge-compat/wwpg-0.2.2-beta.4.jar
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          root = pathlib.Path('.')
          files = ['build/neoforge-compat/wwpg-0.2.2-beta.4.jar',
              'examples/extension-addon/build/libs/wwpg-api-example-1.0.0.jar',
              'examples/cee-addon/build/libs/wwpg-upstream-api-example-1.0.0.jar']
          proof = dict(schema=1, source_sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              compile_neoforge='21.1.231', runtime_neoforge='21.1.248',
              artifacts=[dict(path=p,sha256=hashlib.sha256((root/p).read_bytes()).hexdigest()) for p in files])
          (root/'build/neoforge-compat/inputs.json').write_text(json.dumps(proof,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Prepare NeoForge 21.1.248 before the bounded gameplay run
        run: python tools/run_checked.py --timeout 1200 -- ./gradlew createMinecraftArtifacts -Pneo_version=21.1.248 --no-daemon
      - name: Factory, electronics, loader and profile checks on NeoForge 21.1.248
        run: |
          namespaces=wwpg_platform,wwpg,wwpg_stationary,wwpg_design,wwpg_distribution,wwpg_wires,wwpg_bundle,wwpg_coupled
          if [ '${{ matrix.profile }}' = PINOUT ]; then namespaces="$namespaces,wwpg_pinout"; fi
          python tools/run_checked.py -- ./gradlew runPackagedGameTestServer -Pneo_version=21.1.248 -PtestArtifact=build/neoforge-compat/wwpg-0.2.2-beta.4.jar -PtestProfile=${{ matrix.profile }} -PtestBackend=${{ matrix.backend }} -PtestApiAddon=true -PtestNamespaces="$namespaces" -PtestDirectory=run/neoforge-compat -x build -x jar --no-daemon
          cp run/neoforge-compat/logs/latest.log run/neoforge-compat/setup.log
      - name: Three cold restarts with the same jar, including actual assembly unload/reload cycles
        run: |
          namespaces=wwpg_platform,wwpg,wwpg_stationary,wwpg_design,wwpg_distribution,wwpg_wires,wwpg_bundle,wwpg_coupled
          if [ '${{ matrix.profile }}' = PINOUT ]; then namespaces="$namespaces,wwpg_pinout"; fi
          for pass in 1 2 3; do
            python tools/run_checked.py -- ./gradlew runPackagedGameTestServer -Pneo_version=21.1.248 -PtestArtifact=build/neoforge-compat/wwpg-0.2.2-beta.4.jar -PtestProfile=${{ matrix.profile }} -PtestBackend=${{ matrix.backend }} -PtestApiAddon=true -PtestNamespaces="$namespaces" -PtestDirectory=run/neoforge-compat -PrestartPhase=VERIFY -x build -x jar --no-daemon
            cp run/neoforge-compat/logs/latest.log "run/neoforge-compat/restart-$pass.log"
          done
      - name: Independent API examples, faults and lifecycle checks in their own world
        run: |
          python tools/run_checked.py -- ./gradlew runPackagedGameTestServer -Pneo_version=21.1.248 -PtestArtifact=build/neoforge-compat/wwpg-0.2.2-beta.4.jar -PtestProfile=${{ matrix.profile }} -PtestBackend=${{ matrix.backend }} -PtestApiAddon=true -PtestNamespaces=wwpg_platform,wwpg_api,wwpg_api_faults,wwpg_api_restart,wwpg_api_upstream,wwpg_api_upstream_restart -PtestDirectory=run/neoforge-api -x build -x jar --no-daemon
          cp run/neoforge-api/logs/latest.log run/neoforge-api/setup.log
          for pass in 1 2 3; do
            python tools/run_checked.py -- ./gradlew runPackagedGameTestServer -Pneo_version=21.1.248 -PtestArtifact=build/neoforge-compat/wwpg-0.2.2-beta.4.jar -PtestProfile=${{ matrix.profile }} -PtestBackend=${{ matrix.backend }} -PtestApiAddon=true -PtestNamespaces=wwpg_platform,wwpg_api,wwpg_api_faults,wwpg_api_restart,wwpg_api_upstream,wwpg_api_upstream_restart -PtestDirectory=run/neoforge-api -PrestartPhase=VERIFY -x build -x jar --no-daemon
            cp run/neoforge-api/logs/latest.log "run/neoforge-api/restart-$pass.log"
          done
      - name: Paused circuits and exactly-once stepping
        run: python tools/run_checked.py -- ./gradlew runPackagedGameTestServer -Pneo_version=21.1.248 -PtestArtifact=build/neoforge-compat/wwpg-0.2.2-beta.4.jar -PtestProfile=${{ matrix.profile }} -PtestBackend=${{ matrix.backend }} -PtestApiAddon=true -PtestNamespaces=wwpg_api_pause -PtestDirectory=run/neoforge-pause -x build -x jar --no-daemon
      - name: Save before wire entities are ready, then retire old connections after restart
        run: |
          for phase in SETUP ARM VERIFY; do
            python tools/run_checked.py -- ./gradlew runPackagedGameTestServer -Pneo_version=21.1.248 -PtestArtifact=build/neoforge-compat/wwpg-0.2.2-beta.4.jar -PtestProfile=${{ matrix.profile }} -PtestBackend=${{ matrix.backend }} -PtestApiAddon=true -PtestNamespaces=wwpg_api_pending_restart -PtestDirectory=run/neoforge-pending -PrestartPhase=$phase -x build -x jar --no-daemon
            cp run/neoforge-pending/logs/latest.log "run/neoforge-pending/$phase.log"
          done
      - name: Confirm retained evidence belongs to the frozen jar and actual loader
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          proof=json.loads(pathlib.Path('build/neoforge-compat/inputs.json').read_text())
          for item in proof['artifacts']:
              assert hashlib.sha256(pathlib.Path(item['path']).read_bytes()).hexdigest()==item['sha256'], 'Frozen input changed'
          expected=proof['artifacts'][0]['sha256']
          for name, count in [('neoforge-compat',4), ('neoforge-api',4), ('neoforge-pause',1), ('neoforge-pending',3)]:
              files=sorted(pathlib.Path('run',name).glob('packaged-*.json'))
              assert len(files)==count, 'Missing or additional launch attempt; retain failed evidence'
              for file in files:
                  record=json.loads(file.read_text())
                  assert record.get('completed') and record.get('required_tests_passed',0)>0, 'Incomplete launch'
                  assert record['neoforge']=='21.1.248' and record['sha256']==expected, 'Wrong loader or artifact'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neoforge-248-${{ matrix.os }}-${{ matrix.backend }}-${{ matrix.profile }}
          path: |
            build/neoforge-compat/
            build/test-results/
            build/watchdog/
            run/neoforge-compat/logs/
            run/neoforge-compat/*.log
            run/neoforge-compat/*.json
            run/neoforge-compat/*.nbt
            run/neoforge-api/logs/
            run/neoforge-api/*.log
            run/neoforge-api/*.json
            run/neoforge-api/*.nbt
            run/neoforge-pause/logs/
            run/neoforge-pause/*.json
            run/neoforge-pending/logs/
            run/neoforge-pending/*.log
            run/neoforge-pending/*.json
            run/neoforge-pending/*.nbt
            run/neoforge-*/crash-reports/
