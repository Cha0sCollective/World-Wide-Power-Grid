// Acceptance harness only. The starter itself deliberately has no game-run tasks.
gradle.projectsEvaluated {
    def p = gradle.rootProject
    def starter = p.file(p.providers.gradleProperty('docStarterJar').get())
    def frozen = p.file(p.providers.gradleProperty('docRuntimeJar').get())
    if (!starter.isFile() || !frozen.isFile()) throw new GradleException('Supply the independently built starter and frozen released runtime')
    def source = p.sourceSets.create('docAcceptance') {
        java.srcDir p.file('tools/documentation_acceptance/src')
        resources.srcDir p.file('tools/documentation_acceptance/resources')
        compileClasspath = p.sourceSets.main.compileClasspath + p.files(starter, frozen)
    }
    def helper = p.tasks.register('docAcceptanceJar', Jar) {
        dependsOn p.tasks.named('docAcceptanceClasses')
        from source.output
        archiveFileName = 'wwpg-documentation-acceptance.jar'
        destinationDirectory = p.layout.buildDirectory.dir('doc-acceptance')
        preserveFileTimestamps = false; reproducibleFileOrder = true
    }
    p.tasks.register('runDocumentationServer', JavaExec) {
        dependsOn helper, p.tasks.named('createMinecraftArtifacts'), p.tasks.named('prepareGameTestServerRun'), p.tasks.named('installPgNative')
        javaLauncher = p.javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
        doFirst {
            def run = p.tasks.named('runGameTestServer').get()
            workingDir = p.file(p.providers.gradleProperty('docDirectory').get()); workingDir.mkdirs()
            mainClass = run.mainClass
            args = run.args
            jvmArgs = run.jvmArgs + ['-Dwwpg.test.packaged=false', '-Dwwpg.doc.phase='+p.providers.gradleProperty('docPhase').getOrElse('SETUP')]
            classpath = run.classpathProvider.filter { ![p.sourceSets.main,p.sourceSets.extensionApi,p.sourceSets.ceeApi].any { set -> set.output.files.contains(it) } } + p.files(frozen,starter,helper.get().archiveFile.get().asFile)
            def env = new HashMap(run.environmentProperty.get())
            env['MOD_CLASSES'] = 'wwpg%%'+frozen.absolutePath+File.pathSeparator+'tutorial_load%%'+starter.absolutePath+File.pathSeparator+'wwpg_doc_acceptance%%'+helper.get().archiveFile.get().asFile.absolutePath
            environment env
            def capture = new ByteArrayOutputStream()
            extensions.extraProperties.set('documentationOutput', capture)
            def tee = { OutputStream console -> new OutputStream() {
                void write(int value) { console.write(value); capture.write(value) }
                void write(byte[] bytes,int offset,int length) { console.write(bytes,offset,length); capture.write(bytes,offset,length) }
            } }
            standardOutput = tee(System.out); errorOutput = tee(System.err)
        }
        doLast {
            def text = extensions.extraProperties.get('documentationOutput').toString('UTF-8')
            if (!text.contains('All 4 required tests passed') || text.contains('required tests failed'))
                throw new GradleException('Documentation acceptance did not complete all four tests')
        }
    }
    p.tasks.register('runDocumentationClient', JavaExec) {
        dependsOn helper, p.tasks.named('prepareClientARun'), p.tasks.named('installPgNative')
        javaLauncher = p.javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
        doFirst {
            def run = p.tasks.named('runClientA').get()
            workingDir = p.file(p.providers.gradleProperty('docDirectory').get()); workingDir.mkdirs()
            new File(workingDir,'options.txt').text='soundCategory_music:0.0\npauseOnLostFocus:false\n'
            def example=p.file(p.providers.gradleProperty('docExampleJar').get())
            if(!new File(workingDir,'saves/Documentation Test/level.dat').isFile() || !example.isFile())
                throw new GradleException('Extract an existing disposable test save and supply the released source example jar')
            mainClass = run.mainClass
            args = run.args.collect { argument ->
                if(!argument.startsWith('@')) return argument
                def original=p.file(argument.substring(1)), replacement=p.file('build/doc-acceptance/client-program.txt')
                replacement.text=original.getText('UTF-8').replace('--quickPlayMultiplayer\n127.0.0.1:25575','--quickPlaySingleplayer\n"Documentation Test"').replace('--width\n854','--width\n1280').replace('--height\n480','--height\n720')
                return '@'+replacement.absolutePath
            }
            jvmArgs = run.jvmArgs + ['-Dwwpg.test.packaged=false','-Dwwpg.doc.client=true','-Dwwpg.test.backend='+p.providers.gradleProperty('testBackend').getOrElse('NATIVE')]
            classpath = run.classpathProvider.filter { ![p.sourceSets.main,p.sourceSets.extensionApi,p.sourceSets.ceeApi].any { set -> set.output.files.contains(it) } } + p.files(frozen,starter,example,helper.get().archiveFile.get().asFile)
            def env = new HashMap(run.environmentProperty.get())
            env['MOD_CLASSES']='wwpg%%'+frozen.absolutePath+File.pathSeparator+'tutorial_load%%'+starter.absolutePath+File.pathSeparator+'wwpg_doc_acceptance%%'+helper.get().archiveFile.get().asFile.absolutePath
            environment env
            def capture = new ByteArrayOutputStream();extensions.extraProperties.set('documentationClientOutput',capture)
            def tee = { OutputStream console -> new OutputStream() {
                void write(int value) { console.write(value); capture.write(value) }
                void write(byte[] bytes,int offset,int length) { console.write(bytes,offset,length); capture.write(bytes,offset,length) }
            } }
            standardOutput=tee(System.out);errorOutput=tee(System.err)
        }
        doLast {
            def text=extensions.extraProperties.get('documentationClientOutput').toString('UTF-8')
            if(!text.contains('DOC_CLIENT_PASSED') || text.contains('DOC_CLIENT_FAILED'))throw new GradleException('Graphical documentation test did not pass')
        }
    }

}
