// Explicitly opt in only for this isolated experiment. No ordinary task defaults change.
gradle.projectsEvaluated {
    def p = gradle.rootProject
    def cee = p.file(p.property('experimentalCee'))
    if (!cee.isFile()) throw new GradleException('Missing frozen CEE 1.1.4 input')
    def sha = java.security.MessageDigest.getInstance('SHA-256').digest(cee.bytes).encodeHex().toString()
    if (sha != '2362decf60ace66037eb2ae79f34fed57b5f152e0435164f5f91912ea837052f')
        throw new GradleException('Frozen CEE 1.1.4 input changed')
    p.configurations.implementation.dependencies.removeAll { dep -> dep.group == 'maven.modrinth' && dep.name == 'qYJdIoAx' }
    p.dependencies.add('implementation', p.files(cee))
    p.neoForge.runs.named('gameTestServer') {
        systemProperty 'wwpg.experimental.plainWireBatch', 'true'
        systemProperty 'wwpg.experimental.plainWireBatch.verify', 'true'
        systemProperty 'wwpg.experimental.plainWireBatch.properties', p.providers.gradleProperty('testPropertyWireBatch').getOrElse('false')
        systemProperty 'wwpg.experimental.wireTreeBatch', p.providers.gradleProperty('testWireTreeBatch').getOrElse('false')
        systemProperty 'wwpg.experimental.wireTreeBudgetMillis', p.providers.gradleProperty('testWireTreeBudgetMillis').getOrElse('0')
        systemProperty 'wwpg.experimental.wireTreeMaxParts', p.providers.gradleProperty('testWireTreeMaxParts').getOrElse('32')
        systemProperty 'wwpg.experimental.wireTreeRetainCoverage', p.providers.gradleProperty('testWireTreeRetainCoverage').getOrElse('false')
        systemProperty 'wwpg.experimental.wireTreePrioritizeUnresolved', p.providers.gradleProperty('testWireTreePrioritizeUnresolved').getOrElse('false')
        systemProperty 'wwpg.experimental.chunkTaskBudgetMillis', p.providers.gradleProperty('testChunkTaskBudgetMillis').getOrElse('0')
        systemProperty 'wwpg.experimental.ceeStateGeometry', p.providers.gradleProperty('testCeeStateGeometry').getOrElse('false')
        systemProperty 'wwpg.experimental.scopedRestoration', p.providers.gradleProperty('testScopedRestoration').getOrElse('false')
        systemProperty 'wwpg.experimental.terminalBookkeeping', p.providers.gradleProperty('testTerminalBookkeeping').getOrElse('false')
        systemProperty 'wwpg.experimental.terminalKeyLookup', p.providers.gradleProperty('testTerminalKeyLookup').getOrElse('false')
    }
}
