plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.89'
}

group = 'org.cha0scollective.wwpg'
version = mod_version
base { archivesName = 'wwpg' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }

repositories {
    mavenCentral()
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://mvn.devos.one/snapshots' }
    maven { url = 'https://maven.architectury.dev' }
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://cursemaven.com' } }
        filter { includeGroup 'curse.maven' }
    }
}

def releaseArtifacts = new groovy.json.JsonSlurper().parse(file('release/artifacts.json'))
def optionalArtifacts = new groovy.json.JsonSlurper().parse(file('release/optional-artifacts.json'))
def testProfile = providers.gradleProperty('testProfile').getOrElse('BASE').toUpperCase()
if (!(testProfile in ['BASE', 'PINOUT'])) throw new GradleException('testProfile must be BASE or PINOUT')
configurations { pgNativeReference; upstreamArtifacts; optionalReference }

neoForge {
    version = neo_version
    runs {
        client { client() }
        clientA {
            client()
            jvmArgument '-Xmx2G'
            gameDirectory = layout.projectDirectory.dir('run/client-a')
            systemProperty 'wwpg.test.multiplayer', 'true'
            programArguments.addAll '--username', 'WWPG_A', '--quickPlayMultiplayer', '127.0.0.1:25575', '--width', '854', '--height', '480'
        }
        clientB {
            client()
            jvmArgument '-Xmx2G'
            gameDirectory = layout.projectDirectory.dir('run/client-b')
            systemProperty 'wwpg.test.multiplayer', 'true'
            programArguments.addAll '--username', 'WWPG_B', '--quickPlayMultiplayer', '127.0.0.1:25575', '--width', '854', '--height', '480'
        }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', providers.gradleProperty('testNamespaces').getOrElse(testProfile == 'PINOUT' ? 'wwpg,wwpg_stationary,wwpg_design,wwpg_distribution,wwpg_pinout' : 'wwpg,wwpg_stationary,wwpg_design,wwpg_distribution')
            systemProperty 'wwpg.test.profile', testProfile
            systemProperty 'wwpg.test.energyFixtures', 'true'
            systemProperty 'wwpg.test.backend', providers.gradleProperty('testBackend').getOrElse('NATIVE')
            systemProperty 'wwpg.test.restartPhase', providers.gradleProperty('restartPhase').getOrElse('SETUP')
            systemProperty 'wwpg.test.multiplayer', providers.gradleProperty('multiplayer').getOrElse('false')
        }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods { wwpg { sourceSet sourceSets.main } }
}

dependencies {
    optionalArtifacts.artifacts.each {
        optionalReference(it.coordinate) { transitive = false }
        compileOnly(it.coordinate) { transitive = false }
        if (testProfile == 'PINOUT') runtimeOnly(it.coordinate) { transitive = false }
    }
    releaseArtifacts.artifacts.findAll { it.role != 'pg_native_reference' }.each {
        upstreamArtifacts(it.coordinate) { transitive = false }
    }
    def createClassifier = providers.gradleProperty('publishedRuntime').getOrElse('true') == 'true' ? '' : ':slim'
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}${createClassifier}") { transitive = false }
    implementation 'net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1'
    implementation 'com.tterrag.registrate:Registrate:MC1.21-1.3.0+67'
    compileOnly 'dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:1.0.6'
    runtimeOnly 'dev.engine-room.flywheel:flywheel-neoforge-1.21.1:1.0.6'
    implementation('maven.modrinth:qYJdIoAx:KWxEmmON') { transitive = false }
    implementation('curse.maven:power-grid-1321420:8880715') { transitive = false }
    // PG 0.6.2 omitted native v7. Its NativeMNA interface is byte-identical to 0.6.1.
    pgNativeReference('curse.maven:power-grid-1321420:8738576') { transitive = false }
    implementation 'dev.architectury:architectury-neoforge:13.0.8'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'it.unimi.dsi:fastutil:8.5.12'
    testRuntimeOnly 'org.ejml:ejml-core:0.44.0'
    testRuntimeOnly 'org.ejml:ejml-ddense:0.44.0'
    testRuntimeOnly 'org.ejml:ejml-dsparse:0.44.0'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test') { useJUnitPlatform() }
tasks.named('processResources') {
    dependsOn tasks.named('preparePgNative')
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
    from('LICENSE') { into 'META-INF'; rename { 'WWPG-LICENSE.txt' } }
    from('release') { include 'artifacts.json', 'optional-artifacts.json', 'content-matrix.json', '0.1.0-beta.5/content-matrix.json', '0.1.0-beta.5/registry-inventory.json'; into 'data/wwpg/release' }
    from(layout.buildDirectory.dir('pg-native-resources/native')) { into 'native/wwpg' }
}
tasks.named('jar') { manifest.attributes 'MixinConfigs': 'wwpg.mixins.json' }
tasks.withType(Jar).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    filePermissions { unix('0644') }
    dirPermissions { unix('0755') }
}
tasks.named('wrapper') { distributionType = Wrapper.DistributionType.BIN }

tasks.register('verifyUpstreamArtifacts') {
    inputs.file 'release/artifacts.json'
    inputs.files configurations.upstreamArtifacts, configurations.pgNativeReference
    doLast {
        def resolved = configurations.upstreamArtifacts.resolvedConfiguration.resolvedArtifacts +
                configurations.pgNativeReference.resolvedConfiguration.resolvedArtifacts
        releaseArtifacts.artifacts.each { locked ->
            def artifact = resolved.find { it.moduleVersion.id.toString() == locked.coordinate }
            if (artifact == null) throw new GradleException("Missing locked upstream artifact ${locked.coordinate}")
            def hash = java.security.MessageDigest.getInstance('SHA-256').digest(artifact.file.bytes).encodeHex().toString()
            if (hash != locked.sha256) throw new GradleException("Checksum mismatch for ${locked.coordinate}")
        }
        def pg = resolved.find { it.moduleVersion.id.toString() == releaseArtifacts.artifacts.find { it.role == 'pg' }.coordinate }.file
        def donor = configurations.pgNativeReference.singleFile
        def entry = 'org/patryk3211/powergrid/electricity/sim/solver/NativeMNA.class'
        new java.util.zip.ZipFile(pg).withCloseable { pgZip ->
            new java.util.zip.ZipFile(donor).withCloseable { donorZip ->
                if (!Arrays.equals(pgZip.getInputStream(pgZip.getEntry(entry)).bytes,
                                   donorZip.getInputStream(donorZip.getEntry(entry)).bytes))
                    throw new GradleException('PG native donor JNI interface differs from the pinned PG artifact')
                releaseArtifacts.native_binaries.each { binary ->
                    def hash = java.security.MessageDigest.getInstance('SHA-256')
                            .digest(donorZip.getInputStream(donorZip.getEntry(binary.entry)).bytes).encodeHex().toString()
                    if (hash != binary.sha256) throw new GradleException("Native checksum mismatch: ${binary.entry}")
                }
            }
        }
    }
}
tasks.named('check') { dependsOn tasks.named('verifyUpstreamArtifacts') }

tasks.register('verifyOptionalArtifacts') {
    inputs.file 'release/optional-artifacts.json'
    inputs.files configurations.optionalReference
    doLast {
        def resolved = configurations.optionalReference.resolvedConfiguration.resolvedArtifacts
        optionalArtifacts.artifacts.each { locked ->
            def artifact = resolved.find { it.moduleVersion.id.toString() == locked.coordinate }
            if (artifact == null) throw new GradleException("Missing optional reference ${locked.coordinate}")
            def hash = java.security.MessageDigest.getInstance('SHA-256').digest(artifact.file.bytes).encodeHex().toString()
            if (hash != locked.sha256) throw new GradleException("Optional checksum mismatch: ${locked.coordinate}")
        }
    }
}
tasks.named('check') { dependsOn tasks.named('verifyOptionalArtifacts') }

tasks.register('preparePgNative', Sync) {
    dependsOn tasks.named('verifyUpstreamArtifacts')
    def reference = configurations.pgNativeReference
    from({
        def jar = reference.singleFile
        def checksum = java.security.MessageDigest.getInstance('SHA-256').digest(jar.bytes).encodeHex().toString()
        if (checksum != 'b2835c36af6794a963737c617b5f9dd6b41aba5078d418c88847193fbcf702e5')
            throw new GradleException('PG native reference artifact checksum mismatch')
        zipTree(jar)
    }) {
        include 'native/linux/libpowergridNative7.so', 'native/windows/libpowergridNative7.dll'
    }
    into layout.buildDirectory.dir('pg-native-resources')
}
tasks.register('installPgNative', Copy) {
    dependsOn tasks.named('preparePgNative')
    from(layout.buildDirectory.dir('pg-native-resources')) {
        include 'native/linux/libpowergridNative7.so', 'native/windows/libpowergridNative7.dll'
        eachFile { relativePath = new RelativePath(true, name) }
        includeEmptyDirs = false
    }
    into layout.projectDirectory.dir('run/.pg-native')
}
tasks.matching { it.name.startsWith('run') || it.name.startsWith('prepare') && it.name.endsWith('Run') }.configureEach {
    dependsOn tasks.named('installPgNative')
}

// Use the same NeoForge test harness with WWPG loaded exclusively from the built jar.
tasks.register('runPackagedGameTestServer', JavaExec) {
    def developmentRun = tasks.named('runGameTestServer')
    dependsOn tasks.named('build'), tasks.named('prepareGameTestServerRun'), tasks.named('installPgNative')
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    doFirst {
        def run = developmentRun.get()
        workingDir = file(providers.gradleProperty('testDirectory').getOrElse(run.gameDirectory.get().asFile.absolutePath))
        workingDir.mkdirs()
        mainClass = run.mainClass
        args = run.args
        jvmArgs = run.jvmArgs + ['-Dwwpg.test.packaged=true']
        def packaged = tasks.named('jar').get().archiveFile.get().asFile
        classpath = run.classpathProvider.filter { !sourceSets.main.output.files.contains(it) } + files(packaged)
        def env = new HashMap(run.environmentProperty.get())
        env['MOD_CLASSES'] = "wwpg%%${packaged.absolutePath}"
        environment env
        logger.lifecycle("Testing packaged WWPG artifact: ${packaged.name}")
        def stamp = java.time.Instant.now().toString().replace(':', '-')
        def proof = [schema: 1, artifact: packaged.name,
                sha256: java.security.MessageDigest.getInstance('SHA-256').digest(packaged.bytes).encodeHex().toString(),
                profile: testProfile, backend: providers.gradleProperty('testBackend').getOrElse('NATIVE'),
                phase: providers.gradleProperty('restartPhase').getOrElse('SETUP'), started: stamp,
                namespaces: providers.gradleProperty('testNamespaces').getOrElse('default')]
        def evidence = new File(workingDir, "packaged-${stamp}.json")
        evidence.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(proof)) + '\n'
        extensions.extraProperties.set('wwpgPackagedEvidence', evidence)
    }
}

['A', 'B'].each { suffix ->
    tasks.register("runPackagedClient${suffix}", JavaExec) {
        def developmentRun = tasks.named("runClient${suffix}")
        dependsOn tasks.named('build'), tasks.named("prepareClient${suffix}Run")
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
        doFirst {
            def run = developmentRun.get()
            workingDir = run.gameDirectory.get().asFile
            mainClass = run.mainClass
            args = run.args
            jvmArgs = run.jvmArgs + ['-Dwwpg.test.packaged=true']
            def packaged = tasks.named('jar').get().archiveFile.get().asFile
            classpath = run.classpathProvider.filter { !sourceSets.main.output.files.contains(it) } + files(packaged)
            def env = new HashMap(run.environmentProperty.get())
            env['MOD_CLASSES'] = "wwpg%%${packaged.absolutePath}"
            environment env
        }
    }
}

// A test-only jar keeps the native resource repair but removes the electrical
// bridge hooks, allowing the pinned upstream solvers to capture reference worlds.
tasks.register('prepareReferenceConfig') {
    def output = layout.buildDirectory.file('reference-config/wwpg.mixins.json')
    outputs.file output
    doLast {
        def target = output.get().asFile
        target.parentFile.mkdirs()
        target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
            required: true, minVersion: '0.8', package: 'org.cha0scollective.wwpg.mixin',
            compatibilityLevel: 'JAVA_21', mixins: ['NativeResourceMixin', 'RegistrateCallbacksMixin'],
            client: [], injectors: [defaultRequire: 1]
        ])) + '\n'
    }
}
tasks.register('referenceJar', Jar) {
    dependsOn tasks.named('classes'), tasks.named('prepareReferenceConfig')
    archiveClassifier = 'upstream-reference-tests'
    from(sourceSets.main.output) { exclude 'wwpg.mixins.json' }
    from(layout.buildDirectory.dir('reference-config'))
    manifest.attributes 'MixinConfigs': 'wwpg.mixins.json'
}
['runUpstreamReferenceServer', 'runReferenceCompatibilityServer'].each { taskName ->
    tasks.register(taskName, JavaExec) {
        boolean upstream = taskName == 'runUpstreamReferenceServer'
        def artifact = tasks.named(upstream ? 'referenceJar' : 'jar')
        def developmentRun = tasks.named('runGameTestServer')
        dependsOn artifact, tasks.named('prepareGameTestServerRun')
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
        doFirst {
            def run = developmentRun.get()
            def directory = layout.projectDirectory.dir('run/reference').asFile
            directory.mkdirs()
            workingDir = directory
            mainClass = run.mainClass
            args = run.args
            // Gradle orders -D arguments before @response files. Override the
            // generated properties inside their file so the default namespace
            // cannot silently run the mixed suite with the bridge disabled.
            jvmArgs = run.jvmArgs.collect { argument ->
                if (!argument.startsWith('@')) return argument
                def original = file(argument.substring(1))
                if (!original.isFile()) return argument
                def replacement = layout.buildDirectory.file("reference-config/${taskName}-${original.name}").get().asFile
                replacement.parentFile.mkdirs()
                replacement.text = original.getText('UTF-8')
                    .replaceAll('(?m)^-Dneoforge.enabledGameTestNamespaces=.*$', '-Dneoforge.enabledGameTestNamespaces=wwpg_reference')
                    .replaceAll('(?m)^-Dwwpg.test.restartPhase=.*$', "-Dwwpg.test.restartPhase=${upstream ? 'SETUP' : 'VERIFY'}")
                return "@${replacement.absolutePath}"
            } + ['-Dwwpg.test.packaged=true', "-Dwwpg.test.upstreamReference=${upstream}"]
            def packaged = artifact.get().archiveFile.get().asFile
            classpath = run.classpathProvider.filter { !sourceSets.main.output.files.contains(it) } + files(packaged)
            def env = new HashMap(run.environmentProperty.get())
            env['MOD_CLASSES'] = "wwpg%%${packaged.absolutePath}"
            environment env
        }
    }
}

// NeoForge can return exit code zero after a mod-loading failure. Require the
// current process to report a completed, passing suite as well as a good exit.
tasks.matching { it.name in ['runGameTestServer', 'runPackagedGameTestServer', 'runUpstreamReferenceServer', 'runReferenceCompatibilityServer'] }.configureEach {
    doFirst {
        def capture = new ByteArrayOutputStream()
        extensions.extraProperties.set('wwpgTestOutput', capture)
        def tee = { OutputStream console ->
            new OutputStream() {
                void write(int value) { console.write(value); capture.write(value) }
                void write(byte[] bytes, int offset, int length) {
                    console.write(bytes, offset, length)
                    capture.write(bytes, offset, length)
                }
                void flush() { console.flush() }
            }
        }
        standardOutput = tee(standardOutput ?: System.out)
        errorOutput = tee(errorOutput ?: System.err)
    }
    doLast {
        def output = extensions.extraProperties.get('wwpgTestOutput').toString('UTF-8')
        def passed = output =~ /All (\d+) required tests passed/
        if (!output.contains('GAME TESTS COMPLETE') || !passed.find() || passed.group(1).toInteger() == 0)
            throw new GradleException('GameTest server did not report a completed passing suite; inspect the current run log')
        if (extensions.extraProperties.has('wwpgPackagedEvidence')) {
            def evidence = extensions.extraProperties.get('wwpgPackagedEvidence')
            def proof = new groovy.json.JsonSlurper().parse(evidence)
            proof.required_tests_passed = passed.group(1).toInteger()
            proof.completed = java.time.Instant.now().toString()
            evidence.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(proof)) + '\n'
        }
    }
}
