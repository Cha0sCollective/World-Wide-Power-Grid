plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.89'
}

group = 'org.cha0scollective.wwpg'
version = mod_version
base { archivesName = 'wwpg' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }

// The API is independently versioned and contains no PG/CEE implementation.
sourceSets {
    extensionApi {
        java.srcDir 'src/api/java'
        compileClasspath = configurations.compileClasspath
    }
    ceeApi {
        java.setSrcDirs(['src/ceeApi/java'])
        compileClasspath = configurations.compileClasspath + sourceSets.extensionApi.output
    }
}
sourceSets.main.compileClasspath += sourceSets.extensionApi.output
sourceSets.main.compileClasspath += sourceSets.ceeApi.output
sourceSets.main.runtimeClasspath += sourceSets.extensionApi.output
sourceSets.main.runtimeClasspath += sourceSets.ceeApi.output
sourceSets.test.compileClasspath += sourceSets.extensionApi.output
sourceSets.test.compileClasspath += sourceSets.ceeApi.output
sourceSets.test.runtimeClasspath += sourceSets.extensionApi.output
sourceSets.test.runtimeClasspath += sourceSets.ceeApi.output
// Persisted identity tests use Minecraft's actual NBT format and BlockPos.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

// Test fixtures are a companion mod, never part of the player artifact.
sourceSets {
    gameTest {
        compileClasspath = sourceSets.main.compileClasspath + sourceSets.main.output + sourceSets.extensionApi.output + sourceSets.ceeApi.output
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://mvn.devos.one/snapshots' }
    maven { url = 'https://maven.architectury.dev' }
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://cursemaven.com' } }
        filter { includeGroup 'curse.maven' }
    }
}

def releaseArtifacts = new groovy.json.JsonSlurper().parse(file('release/artifacts.json'))
def optionalArtifacts = new groovy.json.JsonSlurper().parse(file('release/optional-artifacts.json'))
def testProfile = providers.gradleProperty('testProfile').getOrElse('BASE').toUpperCase()
if (!(testProfile in ['BASE', 'PINOUT'])) throw new GradleException('testProfile must be BASE or PINOUT')
configurations { pgNativeReference; upstreamArtifacts; optionalReference }

neoForge {
    version = neo_version
    runs {
        client { client() }
        clientA {
            client()
            jvmArgument '-Xmx2G'
            gameDirectory = layout.projectDirectory.dir('run/client-a')
            systemProperty 'wwpg.test.multiplayer', 'true'
            programArguments.addAll '--username', 'WWPG_A', '--quickPlayMultiplayer', '127.0.0.1:25575', '--width', '854', '--height', '480'
        }
        clientB {
            client()
            jvmArgument '-Xmx2G'
            gameDirectory = layout.projectDirectory.dir('run/client-b')
            systemProperty 'wwpg.test.multiplayer', 'true'
            programArguments.addAll '--username', 'WWPG_B', '--quickPlayMultiplayer', '127.0.0.1:25575', '--width', '854', '--height', '480'
        }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', providers.gradleProperty('testNamespaces').getOrElse(testProfile == 'PINOUT' ? 'wwpg,wwpg_stationary,wwpg_design,wwpg_distribution,wwpg_wires,wwpg_bundle,wwpg_coupled,wwpg_pinout' : 'wwpg,wwpg_stationary,wwpg_design,wwpg_distribution,wwpg_wires,wwpg_bundle,wwpg_coupled')
            systemProperty 'wwpg.test.profile', testProfile
            systemProperty 'wwpg.test.energyFixtures', 'true'
            systemProperty 'wwpg.test.backend', providers.gradleProperty('testBackend').getOrElse('NATIVE')
            systemProperty 'wwpg.restorationBatch', providers.gradleProperty('testRestorationBatch').getOrElse('true')
            systemProperty 'wwpg.test.expectedNeoForge', neo_version
            systemProperty 'wwpg.test.restartPhase', providers.gradleProperty('restartPhase').getOrElse('SETUP')
            systemProperty 'wwpg.test.multiplayer', providers.gradleProperty('multiplayer').getOrElse('false')
            systemProperty 'wwpg.test.stationaryMultiplayer', providers.gradleProperty('stationaryMultiplayer').getOrElse('false')
        }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods {
        wwpg { sourceSet sourceSets.main; sourceSet sourceSets.extensionApi; sourceSet sourceSets.ceeApi }
        wwpg_tests { sourceSet sourceSets.gameTest }
    }
}
neoForge.runs.configureEach { loadedMods = [neoForge.mods.wwpg] }
neoForge.runs.named('gameTestServer') { loadedMods = [neoForge.mods.wwpg, neoForge.mods.wwpg_tests] }

dependencies {
    optionalArtifacts.artifacts.each {
        optionalReference(it.coordinate) { transitive = false }
        compileOnly(it.coordinate) { transitive = false }
        if (testProfile == 'PINOUT') runtimeOnly(it.coordinate) { transitive = false }
    }
    releaseArtifacts.artifacts.findAll { it.role != 'pg_native_reference' }.each {
        upstreamArtifacts(it.coordinate) { transitive = false }
    }
    def createClassifier = providers.gradleProperty('publishedRuntime').getOrElse('true') == 'true' ? '' : ':slim'
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}${createClassifier}") { transitive = false }
    implementation 'net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1'
    implementation 'com.tterrag.registrate:Registrate:MC1.21-1.3.0+67'
    compileOnly 'dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:1.0.6'
    runtimeOnly 'dev.engine-room.flywheel:flywheel-neoforge-1.21.1:1.0.6'
    implementation('maven.modrinth:qYJdIoAx:KWxEmmON') { transitive = false }
    implementation('curse.maven:power-grid-1321420:8880715') { transitive = false }
    // PG 0.6.2 omitted native v7. Its NativeMNA interface is byte-identical to 0.6.1.
    pgNativeReference('curse.maven:power-grid-1321420:8738576') { transitive = false }
    implementation 'dev.architectury:architectury-neoforge:13.0.8'
    // PG supplies EJML at runtime. Compatibility hooks use its existing matrix types.
    compileOnly 'org.ejml:ejml-core:0.44.0'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testCompileOnly 'dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:1.0.6'
    testRuntimeOnly 'dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:1.0.6'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'it.unimi.dsi:fastutil:8.5.12'
    testRuntimeOnly 'org.ejml:ejml-core:0.44.0'
    testRuntimeOnly 'org.ejml:ejml-ddense:0.44.0'
    testRuntimeOnly 'org.ejml:ejml-dsparse:0.44.0'
    testRuntimeOnly 'net.neoforged:bus:8.0.5'
    if (providers.gradleProperty('testApiAddon').getOrElse('false') == 'true') {
        runtimeOnly files(providers.gradleProperty('testExampleArtifact').getOrElse('examples/extension-addon/build/libs/wwpg-api-example-1.0.0.jar'))
        runtimeOnly files(providers.gradleProperty('testUpstreamExampleArtifact').getOrElse('examples/cee-addon/build/libs/wwpg-upstream-api-example-1.0.0.jar'))
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'wwpg.test.apiVersion', api_version
}
// NeoForge's mapped game classpath is a file collection, outside dependency
// conflict resolution. Match its logging API/core when running NBT unit tests.
configurations.testRuntimeClasspath.resolutionStrategy.force(
        'org.apache.logging.log4j:log4j-api:2.22.1',
        'org.apache.logging.log4j:log4j-core:2.22.1',
        'org.apache.logging.log4j:log4j-slf4j2-impl:2.22.1')
tasks.named('processResources') {
    dependsOn tasks.named('preparePgNative')
    dependsOn tasks.named('prepareGuardedPgNative')
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
    from('LICENSE') { into 'META-INF'; rename { 'WWPG-LICENSE.txt' } }
    // Native provenance is part of the player distribution, not a test fixture.
    from('release') { include 'artifacts.json', 'optional-artifacts.json'; into 'data/wwpg/release' }
    from(layout.buildDirectory.dir('pg-native-resources/native')) { into 'native/wwpg' }
    from(layout.buildDirectory.dir('guarded-native-resources/native')) { into 'native/wwpg' }
}

tasks.named('processGameTestResources') {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
    from('release') { include 'artifacts.json', 'optional-artifacts.json', 'content-matrix.json', '0.1.0-beta.5/content-matrix.json', '0.1.0-beta.5/registry-inventory.json'; into 'data/wwpg/release' }
    ['wwpg_loading', 'wwpg_matrix_ownership', 'wwpg_board_startup', 'wwpg_cee_preparation',
     'wwpg_solver_safety', 'wwpg_native_guard', 'wwpg_unload', 'wwpg_contactors', 'wwpg_meter_sampling',
     'wwpg_loader_installation', 'wwpg_loader_addons', 'wwpg_addon_safety', 'wwpg_addon_native_guard'].each { namespace ->
        from('src/gameTest/resources/data/wwpg/structure/empty.nbt') { into "data/${namespace}/structure" }
    }
}

tasks.register('gameTestJar', Jar) {
    archiveClassifier = 'gametests'
    from sourceSets.gameTest.output
}
tasks.named('assemble') { dependsOn tasks.named('gameTestJar') }
tasks.named('jar') {
    from sourceSets.extensionApi.output
    from sourceSets.ceeApi.output
    manifest.attributes 'MixinConfigs': 'wwpg.mixins.json', 'WWPG-API-Version': api_version
}

tasks.register('apiJar', Jar) {
    archiveBaseName = 'wwpg-api'
    archiveVersion = api_version
    from sourceSets.extensionApi.output
    from('LICENSE') { into 'META-INF'; rename { 'WWPG-LICENSE.txt' } }
    manifest.attributes 'WWPG-API-Version': api_version
}
tasks.register('apiSourcesJar', Jar) {
    archiveBaseName = 'wwpg-api'
    archiveVersion = api_version
    archiveClassifier = 'sources'
    from sourceSets.extensionApi.allSource
}
tasks.register('ceeApiJar', Jar) {
    archiveBaseName = 'wwpg-cee-api'
    archiveVersion = api_version
    from sourceSets.ceeApi.output
    from('LICENSE') { into 'META-INF'; rename { 'WWPG-LICENSE.txt' } }
    manifest.attributes 'WWPG-API-Version': api_version
}
tasks.register('ceeApiSourcesJar', Jar) {
    archiveBaseName = 'wwpg-cee-api'
    archiveVersion = api_version
    archiveClassifier = 'sources'
    from sourceSets.ceeApi.allSource
}
tasks.register('ceeApiJavadoc', Javadoc) {
    source = sourceSets.ceeApi.allJava
    classpath = sourceSets.ceeApi.compileClasspath
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
    destinationDir = layout.buildDirectory.dir('docs/cee-api').get().asFile
}
tasks.register('ceeApiJavadocJar', Jar) {
    dependsOn tasks.named('ceeApiJavadoc')
    archiveBaseName = 'wwpg-cee-api'
    archiveVersion = api_version
    archiveClassifier = 'javadoc'
    from tasks.named('ceeApiJavadoc')
}
tasks.register('apiJavadoc', Javadoc) {
    source = sourceSets.extensionApi.allJava
    classpath = sourceSets.extensionApi.compileClasspath
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
    destinationDir = layout.buildDirectory.dir('docs/api').get().asFile
}
tasks.register('apiJavadocJar', Jar) {
    dependsOn tasks.named('apiJavadoc')
    archiveBaseName = 'wwpg-api'
    archiveVersion = api_version
    archiveClassifier = 'javadoc'
    from tasks.named('apiJavadoc')
}
publishing {
    publications {
        ceeExtensionApi(MavenPublication) {
            groupId = project.group
            artifactId = 'wwpg-cee-api'
            version = api_version
            artifact tasks.named('ceeApiJar')
            artifact tasks.named('ceeApiSourcesJar')
            artifact tasks.named('ceeApiJavadocJar')
            pom {
                name = 'WWPG CEE Extension API'
                description = 'CEE 1.1.3 property adapter contracts for WWPG API 1.0.'
                url = 'https://github.com/Cha0sCollective/World-Wide-Power-Grid'
                licenses { license { name = 'MIT'; url = 'https://opensource.org/licenses/MIT' } }
            }
        }
        extensionApi(MavenPublication) {
            groupId = project.group
            artifactId = 'wwpg-api'
            version = api_version
            artifact tasks.named('apiJar')
            artifact tasks.named('apiSourcesJar')
            artifact tasks.named('apiJavadocJar')
            pom {
                name = 'World-Wide Power Grid Extension API'
                description = 'Stationary electrical integration contracts for WWPG; requires a NeoForge 1.21.1 development environment.'
                url = 'https://github.com/Cha0sCollective/World-Wide-Power-Grid'
                licenses { license { name = 'MIT'; url = 'https://opensource.org/licenses/MIT' } }
                scm { url = 'https://github.com/Cha0sCollective/World-Wide-Power-Grid' }
            }
        }
    }
    repositories { maven { name = 'Sdk'; url = layout.buildDirectory.dir('maven-repository') } }
}
tasks.named('assemble') { dependsOn tasks.named('apiJar'), tasks.named('apiSourcesJar'), tasks.named('ceeApiJar'), tasks.named('ceeApiSourcesJar') }
tasks.withType(Jar).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    includeEmptyDirs = false
    filePermissions { unix('0644') }
    dirPermissions { unix('0755') }
}
tasks.named('wrapper') { distributionType = Wrapper.DistributionType.BIN }

tasks.register('verifyUpstreamArtifacts') {
    inputs.file 'release/artifacts.json'
    inputs.files configurations.upstreamArtifacts, configurations.pgNativeReference
    doLast {
        def resolved = configurations.upstreamArtifacts.resolvedConfiguration.resolvedArtifacts +
                configurations.pgNativeReference.resolvedConfiguration.resolvedArtifacts
        releaseArtifacts.artifacts.each { locked ->
            def artifact = resolved.find { it.moduleVersion.id.toString() == locked.coordinate }
            if (artifact == null) throw new GradleException("Missing locked upstream artifact ${locked.coordinate}")
            def hash = java.security.MessageDigest.getInstance('SHA-256').digest(artifact.file.bytes).encodeHex().toString()
            if (hash != locked.sha256) throw new GradleException("Checksum mismatch for ${locked.coordinate}")
        }
        def pg = resolved.find { it.moduleVersion.id.toString() == releaseArtifacts.artifacts.find { it.role == 'pg' }.coordinate }.file
        def donor = configurations.pgNativeReference.singleFile
        def entry = 'org/patryk3211/powergrid/electricity/sim/solver/NativeMNA.class'
        new java.util.zip.ZipFile(pg).withCloseable { pgZip ->
            new java.util.zip.ZipFile(donor).withCloseable { donorZip ->
                if (!Arrays.equals(pgZip.getInputStream(pgZip.getEntry(entry)).bytes,
                                   donorZip.getInputStream(donorZip.getEntry(entry)).bytes))
                    throw new GradleException('PG native donor JNI interface differs from the pinned PG artifact')
                releaseArtifacts.native_binaries.each { binary ->
                    def hash = java.security.MessageDigest.getInstance('SHA-256')
                            .digest(donorZip.getInputStream(donorZip.getEntry(binary.entry)).bytes).encodeHex().toString()
                    if (hash != binary.sha256) throw new GradleException("Native checksum mismatch: ${binary.entry}")
                }
            }
        }
    }
}
tasks.named('check') { dependsOn tasks.named('verifyUpstreamArtifacts') }

tasks.register('verifyOptionalArtifacts') {
    inputs.file 'release/optional-artifacts.json'
    inputs.files configurations.optionalReference
    doLast {
        def resolved = configurations.optionalReference.resolvedConfiguration.resolvedArtifacts
        optionalArtifacts.artifacts.each { locked ->
            def artifact = resolved.find { it.moduleVersion.id.toString() == locked.coordinate }
            if (artifact == null) throw new GradleException("Missing optional reference ${locked.coordinate}")
            def hash = java.security.MessageDigest.getInstance('SHA-256').digest(artifact.file.bytes).encodeHex().toString()
            if (hash != locked.sha256) throw new GradleException("Optional checksum mismatch: ${locked.coordinate}")
        }
    }
}
tasks.named('check') { dependsOn tasks.named('verifyOptionalArtifacts') }

tasks.register('preparePgNative', Sync) {
    dependsOn tasks.named('verifyUpstreamArtifacts')
    def reference = configurations.pgNativeReference
    from({
        def jar = reference.singleFile
        def checksum = java.security.MessageDigest.getInstance('SHA-256').digest(jar.bytes).encodeHex().toString()
        if (checksum != 'b2835c36af6794a963737c617b5f9dd6b41aba5078d418c88847193fbcf702e5')
            throw new GradleException('PG native reference artifact checksum mismatch')
        zipTree(jar)
    }) {
        include 'native/linux/libpowergridNative7.so', 'native/windows/libpowergridNative7.dll'
    }
    into layout.buildDirectory.dir('pg-native-resources')
}
// Native compilation is explicit; normal Java checks never start a compiler or full suite.
tasks.register('prepareGuardedPgNative') {
    def source = providers.provider {
        if (project.hasProperty('guardedNativeDirectory'))
            return layout.projectDirectory.dir(project.property('guardedNativeDirectory').toString())
        def localBuild = layout.buildDirectory.dir('guarded-pg-native').get()
        localBuild.asFile.exists() ? localBuild : layout.projectDirectory.dir('tools/native/prebuilt')
    }
    def destination = layout.buildDirectory.dir('guarded-native-resources/native/safe')
    inputs.files(fileTree('tools/native'), file('tools/build_native_solver.py'))
    inputs.dir(source)
    outputs.dir(destination)
    doLast {
        def digest = { File path -> java.security.MessageDigest.getInstance('SHA-256').digest(path.bytes).encodeHex().toString() }
        def hashes = [:]
        ['windows', 'linux'].each { platform ->
            def name = "libpowergridNative7.${platform == 'windows' ? 'dll' : 'so'}"
            def binary = source.get().file("${platform}/${name}").asFile
            def record = source.get().file("${platform}/manifest.json").asFile
            if (!binary.isFile() || !record.isFile()) throw new GradleException("Build guarded ${platform} native resources first: tools/build_native_solver.py")
            def manifest = new groovy.json.JsonSlurper().parse(record)
            if (digest(binary) != manifest.sha256) throw new GradleException("Guarded ${platform} binary checksum mismatch")
            manifest.inputs.each { path, expected ->
                if (!file(path).isFile() || digest(file(path)) != expected)
                    throw new GradleException("Guarded ${platform} native input changed; rebuild: ${path}")
            }
            copy { from binary; into destination.get().dir(platform) }
            hashes[platform] = manifest.sha256
        }
        destination.get().file('guarded.properties').asFile.text = hashes.collect { platform, hash -> "${platform}.sha256=${hash}" }.join('\n') + '\n'
        copy { from source.get().dir('licenses'); into destination.get().dir('licenses') }
    }
}
tasks.register('installPgNative', Copy) {
    dependsOn tasks.named('preparePgNative')
    from(layout.buildDirectory.dir('pg-native-resources')) {
        include 'native/linux/libpowergridNative7.so', 'native/windows/libpowergridNative7.dll'
        eachFile { relativePath = new RelativePath(true, name) }
        includeEmptyDirs = false
    }
    into layout.projectDirectory.dir('run/.pg-native')
}
tasks.matching { it.name.startsWith('run') || it.name.startsWith('prepare') && it.name.endsWith('Run') }.configureEach {
    dependsOn tasks.named('installPgNative')
}

// Frozen fixture bytes are loaded as a distinct mod alongside the gameplay artifact.
def packagedFixtures = { File gameplay ->
    if (!providers.gradleProperty('testFixtureArtifact').isPresent()) {
        def legacy = new java.util.zip.ZipFile(gameplay)
        try {
            if (legacy.getEntry('org/cha0scollective/wwpg/gametest/WiringGameTests.class') != null) return null
        } finally { legacy.close() }
    }
    def fixture = providers.gradleProperty('testFixtureArtifact').isPresent()
        ? file(providers.gradleProperty('testFixtureArtifact').get())
        : tasks.named('gameTestJar').get().archiveFile.get().asFile
    if (!fixture.isFile()) throw new GradleException("Missing packaged GameTest companion: ${fixture}")
    fixture
}
def configurePackagedClasspath = { task, run, File gameplay ->
    def fixture = packagedFixtures(gameplay)
    task.classpath = run.classpathProvider.filter { ![sourceSets.main,sourceSets.extensionApi,sourceSets.ceeApi,sourceSets.gameTest].any { set -> set.output.files.contains(it) } } + files(gameplay, fixture == null ? [] : [fixture])
    def env = new HashMap(run.environmentProperty.get())
    env['MOD_CLASSES'] = "wwpg%%${gameplay.absolutePath}"
    if (fixture != null) env['MOD_CLASSES'] += File.pathSeparator + "wwpg_tests%%${fixture.absolutePath}"
    task.environment env
    fixture == null ? null : [artifact:fixture.name, sha256:java.security.MessageDigest.getInstance('SHA-256').digest(fixture.bytes).encodeHex().toString()]
}

// Use the same NeoForge test harness with WWPG loaded exclusively from the built jar.
tasks.register('runPackagedGameTestServer', JavaExec) {
    if (!providers.gradleProperty('testFixtureArtifact').isPresent()) dependsOn tasks.named('gameTestJar')
    def developmentRun = tasks.named('runGameTestServer')
    dependsOn tasks.named('build'), tasks.named('createMinecraftArtifacts'), tasks.named('prepareGameTestServerRun'), tasks.named('installPgNative')
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    doFirst {
        def run = developmentRun.get()
        workingDir = file(providers.gradleProperty('testDirectory').getOrElse(run.gameDirectory.get().asFile.absolutePath))
        workingDir.mkdirs()
        mainClass = run.mainClass
        args = run.args
        jvmArgs = run.jvmArgs + ['-Dwwpg.test.packaged=true']
        // Test one frozen jar against another loader without silently substituting
        // the jar rebuilt for that loader. The normal release CI keeps its default.
        def packaged = providers.gradleProperty('testArtifact').isPresent()
                ? file(providers.gradleProperty('testArtifact').get())
                : tasks.named('jar').get().archiveFile.get().asFile
        if (!packaged.isFile()) throw new GradleException("Missing packaged test artifact: ${packaged}")
        def fixtureProof = configurePackagedClasspath(delegate, run, packaged)
        logger.lifecycle("Testing packaged WWPG artifact: ${packaged.name}")
        def stamp = java.time.Instant.now().toString().replace(':', '-')
        def proof = [schema: 1, artifact: packaged.name, test_fixture_artifact: fixtureProof, neoforge: neo_version, minecraft: minecraft_version,
                sha256: java.security.MessageDigest.getInstance('SHA-256').digest(packaged.bytes).encodeHex().toString(),
                profile: testProfile, backend: providers.gradleProperty('testBackend').getOrElse('NATIVE'),
                phase: providers.gradleProperty('restartPhase').getOrElse('SETUP'), started: stamp,
                namespaces: providers.gradleProperty('testNamespaces').getOrElse('default')]
        if(providers.gradleProperty('testApiAddon').getOrElse('false')=='true') {
            proof.addon_artifacts=[:]
            [example:providers.gradleProperty('testExampleArtifact').getOrElse('examples/extension-addon/build/libs/wwpg-api-example-1.0.0.jar'),
             upstream_example:providers.gradleProperty('testUpstreamExampleArtifact').getOrElse('examples/cee-addon/build/libs/wwpg-upstream-api-example-1.0.0.jar')].each { role,path ->
                def addon=file(path)
                if(!addon.isFile())throw new GradleException("Missing independent API example: ${path}")
                proof.addon_artifacts[role]=[artifact:addon.name,
                    sha256:java.security.MessageDigest.getInstance('SHA-256').digest(addon.bytes).encodeHex().toString()]
            }
        }
        def evidence = new File(workingDir, "packaged-${stamp}.json")
        evidence.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(proof)) + '\n'
        extensions.extraProperties.set('wwpgPackagedEvidence', evidence)
    }
}

['A', 'B'].each { suffix ->
    tasks.register("runPackagedClient${suffix}", JavaExec) {
        if (!providers.gradleProperty('testFixtureArtifact').isPresent()) dependsOn tasks.named('gameTestJar')
        def developmentRun = tasks.named("runClient${suffix}")
        dependsOn tasks.named('build'), tasks.named("prepareClient${suffix}Run")
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
        doFirst {
            def run = developmentRun.get()
            workingDir = run.gameDirectory.get().asFile
            mainClass = run.mainClass
            args = run.args
            jvmArgs = run.jvmArgs + ['-Dwwpg.test.packaged=true']
            def packaged = tasks.named('jar').get().archiveFile.get().asFile
            def fixtureProof = configurePackagedClasspath(delegate, run, packaged)
        }
    }
}

// A test-only jar keeps the native resource repair but removes the electrical
// bridge hooks, allowing the pinned upstream solvers to capture reference worlds.
sourceSets {
    referenceControl {
        java.srcDir 'tools/reference_control'
        compileClasspath = sourceSets.main.compileClasspath + sourceSets.main.output + sourceSets.extensionApi.output + sourceSets.ceeApi.output + sourceSets.gameTest.output
    }
}
tasks.register('prepareReferenceConfig') {
    def output = layout.buildDirectory.file('reference-config/wwpg.mixins.json')
    outputs.file output
    doLast {
        def target = output.get().asFile
        target.parentFile.mkdirs()
        target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
            required: true, minVersion: '0.8', package: 'org.cha0scollective.wwpg.mixin',
            compatibilityLevel: 'JAVA_21', mixins: ['NativeResourceMixin', 'PgNativeFailureMixin', 'PgSolverFailureMixin', 'RegistrateCallbacksMixin', 'ElectricalNetworkAccessor', 'ReferenceTeardownMixin'],
            client: [], injectors: [defaultRequire: 1]
        ])) + '\n'
    }
}
tasks.register('referenceJar', Jar) {
    dependsOn tasks.named('classes'), tasks.named('referenceControlClasses'), tasks.named('prepareReferenceConfig')
    archiveClassifier = 'upstream-reference-tests'
    from(sourceSets.main.output) { exclude 'wwpg.mixins.json' }
    from sourceSets.extensionApi.output
    from sourceSets.ceeApi.output
    from sourceSets.referenceControl.output
    from(layout.buildDirectory.dir('reference-config'))
    manifest.attributes 'MixinConfigs': 'wwpg.mixins.json'
}
['runUpstreamReferenceServer', 'runReferenceCompatibilityServer'].each { taskName ->
    tasks.register(taskName, JavaExec) {
        if (!providers.gradleProperty('testFixtureArtifact').isPresent()) dependsOn tasks.named('gameTestJar')
        boolean upstream = taskName == 'runUpstreamReferenceServer'
        def artifact = tasks.named(upstream ? 'referenceJar' : 'jar')
        def developmentRun = tasks.named('runGameTestServer')
        dependsOn tasks.named('prepareGameTestServerRun')
        if (!providers.gradleProperty('referenceArtifact').isPresent()) dependsOn artifact
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
        doFirst {
            def run = developmentRun.get()
            def directory = file(providers.gradleProperty('referenceDirectory').getOrElse('run/reference'))
            directory.mkdirs()
            workingDir = directory
            mainClass = run.mainClass
            args = run.args
            // Gradle orders -D arguments before @response files. Override the
            // generated properties inside their file so the default namespace
            // cannot silently run the mixed suite with the bridge disabled.
            jvmArgs = run.jvmArgs.collect { argument ->
                if (!argument.startsWith('@')) return argument
                def original = file(argument.substring(1))
                if (!original.isFile()) return argument
                def replacement = layout.buildDirectory.file("reference-config/${taskName}-${original.name}").get().asFile
                replacement.parentFile.mkdirs()
                replacement.text = original.getText('UTF-8')
                    .replaceAll('(?m)^-Dneoforge.enabledGameTestNamespaces=.*$', '-Dneoforge.enabledGameTestNamespaces=wwpg_reference')
                    .replaceAll('(?m)^-Dwwpg.test.restartPhase=.*$', "-Dwwpg.test.restartPhase=${upstream ? 'SETUP' : 'VERIFY'}")
                return "@${replacement.absolutePath}"
            } + ['-Dwwpg.test.packaged=true', "-Dwwpg.test.upstreamReference=${upstream}",
                "-Dwwpg.test.tightReferencePrecision=${providers.gradleProperty('tightReferencePrecision').getOrElse('false')}"]
            def packaged = providers.gradleProperty('referenceArtifact').isPresent()
                ? file(providers.gradleProperty('referenceArtifact').get()) : artifact.get().archiveFile.get().asFile
            def fixtureProof = configurePackagedClasspath(delegate, run, packaged)
            def stamp = java.time.Instant.now().toString().replace(':', '-')
            def proof = [schema: 1, artifact: packaged.name, test_fixture_artifact: fixtureProof,
                sha256: java.security.MessageDigest.getInstance('SHA-256').digest(packaged.bytes).encodeHex().toString(),
                profile: testProfile, backend: providers.gradleProperty('testBackend').getOrElse('NATIVE'),
                upstream: upstream, started: stamp, namespaces: 'wwpg_reference',
                neoforge: providers.gradleProperty('neo_version').getOrElse('21.1.231')]
            def evidence = new File(directory, "reference-packaged-${stamp}.json")
            evidence.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(proof)) + '\n'
            extensions.extraProperties.set('wwpgPackagedEvidence', evidence)
        }
    }
}

// NeoForge can return exit code zero after a mod-loading failure. Require the
// current process to report a completed, passing suite as well as a good exit.
tasks.matching { it.name in ['runGameTestServer', 'runPackagedGameTestServer', 'runUpstreamReferenceServer', 'runReferenceCompatibilityServer'] }.configureEach {
    doFirst {
        def capture = new ByteArrayOutputStream()
        extensions.extraProperties.set('wwpgTestOutput', capture)
        def tee = { OutputStream console ->
            new OutputStream() {
                void write(int value) { console.write(value); capture.write(value) }
                void write(byte[] bytes, int offset, int length) {
                    console.write(bytes, offset, length)
                    capture.write(bytes, offset, length)
                }
                void flush() { console.flush() }
            }
        }
        standardOutput = tee(standardOutput ?: System.out)
        errorOutput = tee(errorOutput ?: System.err)
    }
    doLast {
        def output = extensions.extraProperties.get('wwpgTestOutput').toString('UTF-8')
        def passed = output =~ /All (\d+) required tests passed/
        if (!output.contains('GAME TESTS COMPLETE') || !passed.find() || passed.group(1).toInteger() == 0)
            throw new GradleException('GameTest server did not report a completed passing suite; inspect the current run log')
        if (extensions.extraProperties.has('wwpgPackagedEvidence')) {
            def evidence = extensions.extraProperties.get('wwpgPackagedEvidence')
            def proof = new groovy.json.JsonSlurper().parse(evidence)
            proof.required_tests_passed = passed.group(1).toInteger()
            proof.completed = java.time.Instant.now().toString()
            evidence.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(proof)) + '\n'
        }
    }
}
